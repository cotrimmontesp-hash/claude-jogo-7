<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120d08" />
    <title>Sombra de Vila Rica</title>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #120d08; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      #carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #e8b64a; font: 900 22px sans-serif; letter-spacing: 2px; z-index: 1; pointer-events: none; }
      #erro { display: none; position: fixed; inset: 0; background: #120d08; color: #f3eadb; padding: 20px;
        font: 14px monospace; white-space: pre-wrap; overflow: auto; z-index: 9999; }
    </style>
    <script>
      // Mostra qualquer erro na tela (para mandar print), em vez de ficar tudo preto.
      function mostrarErro(msg) {
        var e = document.getElementById('erro');
        if (!e) return;
        e.style.display = 'block';
        e.textContent += '⚠ Erro ao abrir o jogo — tire um print e mande para o Claude:\n\n' + msg + '\n\n';
      }
      window.addEventListener('error', function (ev) { mostrarErro((ev.error && ev.error.stack) || ev.message); });
      window.addEventListener('unhandledrejection', function (ev) { var r = ev.reason; mostrarErro((r && r.stack) || String(r)); });
    </script>
  </head>
  <body>
    <noscript>Ative o JavaScript para jogar.</noscript>
    <div id="carregando">CARREGANDO…</div>
    <div id="erro"></div>
    <div id="root"></div>
  </body>
</html>
